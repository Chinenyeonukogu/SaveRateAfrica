name: Fetch Wise exchange rates

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-save-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Wise rates and save to Supabase
        env:
          SUPABASE_URL: https://lbcntbalsinojbbsvcra.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WISE_API_TOKEN: ${{ secrets.WISE_API_TOKEN }}
        run: node scripts/fetch-rates.js
